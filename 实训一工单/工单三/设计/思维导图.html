<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 招股说明书智能问答系统 — 思维导图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1b2e; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; height: 100vh; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 24px; background: rgba(26,27,46,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  #toolbar h1 { font-size: 16px; color: #c8d6e5; font-weight: 500; margin-right: auto; }
  #toolbar button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    color: #c8d6e5; padding: 6px 16px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: all 0.2s;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.12); }
  #toolbar .hint { color: #5f6a7a; font-size: 12px; }

  /* ── SVG Canvas ── */
  svg { display: block; width: 100%; height: 100vh; cursor: grab; }
  svg:active { cursor: grabbing; }

  /* ── Nodes ── */
  .node-rect {
    fill: #2d2f4a; stroke: #3d3f5a; stroke-width: 1.5; rx: 8; ry: 8;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.25));
    transition: all 0.15s;
  }
  .node-rect.level-0 { fill: #6c5ce7; stroke: #7c6cf7; }
  .node-rect.level-1 { fill: #2d3436; stroke: #00b894; }
  .node-rect.level-2 { fill: #2d2f4a; stroke: #74b9ff; }

  .node-text {
    fill: #dfe6e9; font-size: 14px; dominant-baseline: central;
    text-anchor: middle; pointer-events: none;
  }
  .node-text.level-0 { fill: #fff; font-size: 18px; font-weight: 600; }
  .node-text.level-1 { fill: #dfe6e9; font-size: 14px; font-weight: 600; }

  .node-text.level-3 {
    fill: #b2bec3; font-size: 11px; font-weight: 400;
    text-anchor: start; pointer-events: none;
  }

  /* ── Links ── */
  .link { stroke: #4a4d6a; stroke-width: 2; fill: none; stroke-linecap: round; }
  .link.level-0 { stroke: #7c6cf7; stroke-width: 2.5; }
  .link.level-1 { stroke: #4a4d6a; stroke-width: 1.5; }

  /* ── Legend card ── */
  #legend {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(26,27,46,0.9); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 8px 20px; display: flex; gap: 24px; align-items: center;
    color: #5f6a7a; font-size: 12px; z-index: 100;
  }
  .legend-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .legend-dot.l0 { background: #6c5ce7; }
  .legend-dot.l1 { background: #00b894; }
  .legend-dot.l2 { background: #74b9ff; }
</style>
</head>
<body>

<!-- ─── Toolbar ─── -->
<div id="toolbar">
  <h1>🧠 PDF招股说明书智能问答系统 — 思维导图</h1>
  <span class="hint">🖱 拖拽平移 · 滚轮缩放</span>
  <button onclick="resetView()">重置视图</button>
  <button onclick="toggleCollapse()">折叠/展开</button>
  <button onclick="savePNG()">导出 PNG</button>
</div>

<!-- ─── SVG Canvas ─── -->
<svg id="canvas" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c5ce7" />
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0f1020"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <g id="mindmap"></g>
</svg>

<!-- ─── Legend ─── -->
<div id="legend">
  <span><span class="legend-dot l0"></span>根节点</span>
  <span><span class="legend-dot l1"></span>一级分支</span>
  <span><span class="legend-dot l2"></span>二级分支</span>
  <span style="color:#5f6a7a;">|  滚轮缩放 · 拖拽平移</span>
</div>

<script>
// ══════════════════════════════════════════
//  Mind Map Data
// ══════════════════════════════════════════
const data = {
  id: "root", label: "PDF 招股说明书\n智能问答系统", level: 0, w: 180, h: 60,
  children: [
    { id: "overview", label: "📋 系统概述", level: 1, w: 140, h: 38, children: [
      { id: "o1", label: "基于 RAG 的 PDF 问答系统", level: 2, w: 175, h: 28 },
      { id: "o2", label: "针对招股说明书设计", level: 2, w: 155, h: 28 },
      { id: "o3", label: "自然语言提问→检索→生成回答", level: 2, w: 215, h: 28 },
      { id: "o4", label: "工单：NLP-RAG-PDF问答系统", level: 2, w: 200, h: 28 },
    ]},
    { id: "features", label: "⚡ 核心功能", level: 1, w: 140, h: 38, children: [
      { id: "f1", label: "PDF 解析 MinerU / PyMuPDF", level: 2, w: 185, h: 28 },
      { id: "f2", label: "4 种切块策略", level: 2, w: 130, h: 28 },
      { id: "f3", label: "BM25 + 向量 + RRF 混合检索", level: 2, w: 200, h: 28 },
      { id: "f4", label: "Redis 短期 + Milvus 长期记忆", level: 2, w: 205, h: 28 },
      { id: "f5", label: "元数据直答 + 规则抽取 + LLM", level: 2, w: 200, h: 28 },
      { id: "f6", label: "工单问题批量评估", level: 2, w: 150, h: 28 },
    ]},
    { id: "arch", label: "🏗 技术架构", level: 1, w: 140, h: 38, children: [
      { id: "a1", label: "Streamlit 前端 (port 8502)", level: 2, w: 185, h: 28 },
      { id: "a2", label: "Python RAG 引擎 (rag_engine.py)", level: 2, w: 215, h: 28 },
      { id: "a3", label: "HybridRetriever (BM25+Milvus)", level: 2, w: 205, h: 28 },
      { id: "a4", label: "LLM Engine (SiliconFlow API)", level: 2, w: 195, h: 28 },
      { id: "a5", label: "sentence-transformers 嵌入模型", level: 2, w: 210, h: 28 },
      { id: "a6", label: "Redis + Milvus (Docker)", level: 2, w: 175, h: 28 },
    ]},
    { id: "dirs", label: "📁 目录结构", level: 1, w: 140, h: 38, children: [
      { id: "d1", label: "data/ — PDF 原文存放", level: 2, w: 165, h: 28 },
      { id: "d2", label: "pdf_parser/ — PDF 解析模块", level: 2, w: 180, h: 28 },
      { id: "d3", label: "src/ — 核心业务逻辑", level: 2, w: 160, h: 28 },
      { id: "d4", label: "utils/ — LLM调用/评估/日志", level: 2, w: 190, h: 28 },
      { id: "d5", label: "app.py — Streamlit 前端", level: 2, w: 175, h: 28 },
      { id: "d6", label: "main.py — 统一启动入口", level: 2, w: 175, h: 28 },
    ]},
    { id: "modes", label: "▶ 运行模式", level: 1, w: 140, h: 38, children: [
      { id: "m1", label: "Web 模式 — streamlit (8502)", level: 2, w: 195, h: 28 },
      { id: "m2", label: "CLI 模式 — main.py --mode cli", level: 2, w: 205, h: 28 },
      { id: "m3", label: "工单测试 — test_工单问题.py", level: 2, w: 200, h: 28 },
    ]},
    { id: "services", label: "🔧 依赖服务", level: 1, w: 140, h: 38, children: [
      { id: "s1", label: "Redis (port 6379) — 短期记忆", level: 2, w: 205, h: 28 },
      { id: "s2", label: "Milvus (port 19530) — 向量库", level: 2, w: 200, h: 28 },
      { id: "s3", label: "SiliconFlow API — LLM 服务", level: 2, w: 195, h: 28 },
      { id: "s4", label: "MinerU (WSL) — PDF 高精度解析", level: 2, w: 220, h: 28 },
    ]},
    { id: "deploy", label: "🚀 部署流程", level: 1, w: 140, h: 38, children: [
      { id: "e1", label: "1. python -m venv .venv", level: 2, w: 175, h: 28 },
      { id: "e2", label: "2. pip install -r requirements.txt", level: 2, w: 225, h: 28 },
      { id: "e3", label: "3. docker compose up -d", level: 2, w: 185, h: 28 },
      { id: "e4", label: "4. 配置 .env (API Key 等)", level: 2, w: 195, h: 28 },
      { id: "e5", label: "5. 放置 PDF 到 data/", level: 2, w: 160, h: 28 },
      { id: "e6", label: "6. python main.py 启动", level: 2, w: 175, h: 28 },
    ]},
    { id: "config", label: "⚙ 配置管理", level: 1, w: 140, h: 38, children: [
      { id: "c1", label: ".env — API Key / 模型选择", level: 2, w: 195, h: 28 },
      { id: "c2", label: "src/config.py — 检索/切块参数", level: 2, w: 210, h: 28 },
      { id: "c3", label: "Streamlit 侧边栏 — 动态调整", level: 2, w: 195, h: 28 },
      { id: "c4", label: "切块策略/大小/重叠/检索模式", level: 2, w: 200, h: 28 },
    ]},
  ]
};

// ══════════════════════════════════════════
//  Layout & Render
// ══════════════════════════════════════════
const SVG_NS = "http://www.w3.org/2000/svg";
const NODE_GAP_X = 260;  // horizontal gap between levels
const NODE_GAP_Y = 12;   // vertical gap between siblings
const CHILD_OFFSET_X = 90;

let nodePositions = {};
let collapsed = {};

function layoutTree(node, depth, startY, parentX) {
  if (!node) return startY;

  const w = node.w || 140;
  const h = node.h || 36;
  const x = depth === 0 ? 0 : parentX + NODE_GAP_X;

  let children = (node.children || []).filter(c => !collapsed[c.id]);

  if (children.length === 0) {
    nodePositions[node.id] = { x, y: startY, w, h, node, depth };
    return startY + h + NODE_GAP_Y;
  }

  // layout children first to know total height
  let childY = startY;
  let childMids = [];
  for (const child of children) {
    const beforeY = childY;
    childY = layoutTree(child, depth + 1, childY, x + CHILD_OFFSET_X);
    childMids.push({ id: child.id, y: (beforeY + childY - NODE_GAP_Y) / 2 });
  }

  const totalChildH = childY - startY;
  const myY = startY + totalChildH / 2 - h / 2;
  nodePositions[node.id] = { x, y: myY, w, h, node, depth, children: childMids };

  return childY;
}

function computeEdges() {
  const edges = [];
  for (const [id, pos] of Object.entries(nodePositions)) {
    if (!pos.children) continue;
    for (const child of pos.children) {
      const cp = nodePositions[child.id];
      if (!cp) continue;
      edges.push({
        from: { x: pos.x + pos.w / 2, y: pos.y + pos.h / 2 },
        to: { x: cp.x, y: child.y },
        fromLevel: pos.depth,
      });
    }
  }
  return edges;
}

function render() {
  // Re-layout
  nodePositions = {};
  layoutTree(data, 0, 60, 0);

  const g = document.getElementById("mindmap");
  g.innerHTML = "";

  // Edges
  const edges = computeEdges();
  for (const e of edges) {
    const line = document.createElementNS(SVG_NS, "path");
    const dx = e.to.x - e.from.x;
    const cpx = e.from.x + dx * 0.5;
    const d = `M ${e.from.x},${e.from.y} Q ${cpx},${e.from.y} ${cpx},${e.to.y} L ${e.to.x},${e.to.y}`;
    line.setAttribute("d", d);
    line.classList.add("link");
    if (e.fromLevel === 0) line.classList.add("level-0");
    else line.classList.add("level-1");
    g.appendChild(line);
  }

  // Nodes
  for (const [id, pos] of Object.entries(nodePositions)) {
    const { x, y, w, h, node, depth } = pos;

    // Background rect
    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.classList.add("node-rect", `level-${depth}`);
    if (depth === 0) rect.style.filter = "url(#glow)";
    g.appendChild(rect);

    // Label
    const label = node.label || "";
    const lines = label.split("\n");
    const text = document.createElementNS(SVG_NS, "text");
    text.classList.add("node-text", `level-${depth}`);
    const centerY = y + h / 2;
    if (lines.length === 1) {
      text.setAttribute("x", x + w / 2);
      text.setAttribute("y", centerY);
      text.textContent = lines[0];
    } else {
      for (let i = 0; i < lines.length; i++) {
        const tspan = document.createElementNS(SVG_NS, "tspan");
        tspan.setAttribute("x", x + w / 2);
        tspan.setAttribute("dy", i === 0 ? "-7" : "16");
        tspan.textContent = lines[i];
        text.appendChild(tspan);
      }
    }
    g.appendChild(text);

    // Collapse toggle for nodes with children
    if (node.children && node.children.length > 0 && depth > 0) {
      const toggle = document.createElementNS(SVG_NS, "text");
      toggle.setAttribute("x", x + w - 14);
      toggle.setAttribute("y", y + h / 2 + 1);
      toggle.setAttribute("font-size", "12");
      toggle.setAttribute("fill", "#74b9ff");
      toggle.setAttribute("cursor", "pointer");
      toggle.setAttribute("text-anchor", "middle");
      toggle.setAttribute("dominant-baseline", "central");
      toggle.textContent = collapsed[node.id] ? "▶" : "▼";
      toggle.style.userSelect = "none";
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        collapsed[node.id] = !collapsed[node.id];
        render();
      });
      g.appendChild(toggle);
    }
  }
}

// ══════════════════════════════════════════
//  Pan & Zoom
// ══════════════════════════════════════════
let viewState = { tx: 0, ty: 0, scale: 1 };
let isDragging = false, dragStart = { x: 0, y: 0 };
const svg = document.getElementById("canvas");
const mindmap = document.getElementById("mindmap");

function applyTransform() {
  const { tx, ty, scale } = viewState;
  mindmap.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}
applyTransform();

svg.addEventListener("mousedown", (e) => {
  isDragging = true;
  dragStart.x = e.clientX - viewState.tx;
  dragStart.y = e.clientY - viewState.ty;
  svg.style.cursor = "grabbing";
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  viewState.tx = e.clientX - dragStart.x;
  viewState.ty = e.clientY - dragStart.y;
  applyTransform();
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  svg.style.cursor = "grab";
});

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(2, Math.max(0.3, viewState.scale * factor));
  // zoom toward mouse
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  viewState.tx = mx - (mx - viewState.tx) * (newScale / viewState.scale);
  viewState.ty = my - (my - viewState.ty) * (newScale / viewState.scale);
  viewState.scale = newScale;
  applyTransform();
}, { passive: false });

// Touch support
let lastTouch = null;
svg.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
});
svg.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1 && lastTouch) {
    e.preventDefault();
    viewState.tx += e.touches[0].clientX - lastTouch.x;
    viewState.ty += e.touches[0].clientY - lastTouch.y;
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    applyTransform();
  }
});
svg.addEventListener("touchend", () => { lastTouch = null; });

window.resetView = function() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  viewState.tx = w * 0.12;
  viewState.ty = h * 0.1;
  viewState.scale = 0.85;
  applyTransform();
};
resetView();

window.toggleCollapse = function() {
  // Toggle all level-1 nodes
  for (const child of data.children) {
    if (child.children) {
      collapsed[child.id] = collapsed[child.id] ? false : true;
    }
  }
  render();
};

window.savePNG = function() {
  // Use html2canvas approach - simple SVG to data URL
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '问答系统思维导图.svg';
  a.click();
  URL.revokeObjectURL(url);
};

// ── Init ──
render();
resetView();
</script>
</body>
</html>
