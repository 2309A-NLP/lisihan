const SVG_NS = "http://www.w3.org/2000/svg";
const NODE_GAP_X = 250;
const NODE_GAP_Y = 10;
const CHILD_OFFSET_X = 85;
const LEAF_GAP_Y = 6;

let nodePositions = {};
let collapsed = {};

function layoutTree(node, depth, startY, parentX) {
  if (!node) return startY;
  const w = node.w || 140;
  const h = node.h || 36;
  const x = depth === 0 ? 0 : parentX + NODE_GAP_X;
  let children = (node.children || []).filter(c => !collapsed[c.id]);
  if (children.length === 0) {
    nodePositions[node.id] = { x, y: startY, w, h, node, depth };
    return startY + h + (depth >= 2 ? LEAF_GAP_Y : NODE_GAP_Y);
  }
  let childY = startY;
  let childMids = [];
  for (const child of children) {
    const beforeY = childY;
    childY = layoutTree(child, depth + 1, childY, x + CHILD_OFFSET_X);
    childMids.push({ id: child.id, y: (beforeY + childY - (depth >= 2 ? LEAF_GAP_Y : NODE_GAP_Y)) / 2 });
  }
  const totalChildH = childY - startY;
  const myY = startY + totalChildH / 2 - h / 2;
  nodePositions[node.id] = { x, y: myY, w, h, node, depth, children: childMids };
  return childY;
}

function computeEdges() {
  const edges = [];
  for (const [id, pos] of Object.entries(nodePositions)) {
    if (!pos.children) continue;
    for (const child of pos.children) {
      const cp = nodePositions[child.id];
      if (!cp) continue;
      edges.push({
        from: { x: pos.x + pos.w / 2, y: pos.y + pos.h / 2 },
        to: { x: cp.x, y: child.y },
        fromLevel: pos.depth,
      });
    }
  }
  return edges;
}

function render() {
  nodePositions = {};
  layoutTree(data, 0, 50, 0);
  const g = document.getElementById("mindmap");
  g.innerHTML = "";

  const edges = computeEdges();
  for (const e of edges) {
    const line = document.createElementNS(SVG_NS, "path");
    const dx = e.to.x - e.from.x;
    const cpx = e.from.x + dx * 0.5;
    const d = `M ${e.from.x},${e.from.y} Q ${cpx},${e.from.y} ${cpx},${e.to.y} L ${e.to.x},${e.to.y}`;
    line.setAttribute("d", d);
    line.classList.add("link");
    if (e.fromLevel === 0) line.classList.add("level-0");
    g.appendChild(line);
  }

  for (const [id, pos] of Object.entries(nodePositions)) {
    const { x, y, w, h, node, depth } = pos;
    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.classList.add("node-rect", `level-${depth}`);
    if (node.isNew && depth === 2) {
      rect.setAttribute("stroke", "#00b894");
      rect.setAttribute("stroke-dasharray", "4,3");
    }
    if (depth === 0) rect.style.filter = "url(#glow)";
    g.appendChild(rect);

    // NEW badge for level-1 new sections
    if (node.isNew && depth === 1) {
      const badge = document.createElementNS(SVG_NS, "rect");
      badge.setAttribute("x", x + w - 22);
      badge.setAttribute("y", y + 4);
      badge.setAttribute("width", 18);
      badge.setAttribute("height", 12);
      badge.setAttribute("rx", 6);
      badge.setAttribute("fill", "#00b894");
      badge.setAttribute("opacity", "0.9");
      g.appendChild(badge);
      const badgeText = document.createElementNS(SVG_NS, "text");
      badgeText.setAttribute("x", x + w - 13);
      badgeText.setAttribute("y", y + 10);
      badgeText.setAttribute("font-size", "7");
      badgeText.setAttribute("fill", "#fff");
      badgeText.setAttribute("font-weight", "bold");
      badgeText.setAttribute("text-anchor", "middle");
      badgeText.textContent = "NEW";
      g.appendChild(badgeText);
    }

    const label = node.label || "";
    const lines = label.split("\n");
    const text = document.createElementNS(SVG_NS, "text");
    text.classList.add("node-text", `level-${depth}`);
    const centerY = y + h / 2;
    if (lines.length === 1) {
      text.setAttribute("x", x + w / 2);
      text.setAttribute("y", centerY);
      text.textContent = lines[0];
    } else {
      for (let i = 0; i < lines.length; i++) {
        const tspan = document.createElementNS(SVG_NS, "tspan");
        tspan.setAttribute("x", x + w / 2);
        tspan.setAttribute("dy", i === 0 ? "-7" : "16");
        tspan.textContent = lines[i];
        text.appendChild(tspan);
      }
    }
    g.appendChild(text);

    if (node.children && node.children.length > 0 && depth > 0) {
      const toggle = document.createElementNS(SVG_NS, "text");
      toggle.setAttribute("x", x + w - 14);
      toggle.setAttribute("y", y + h / 2 + 1);
      toggle.setAttribute("font-size", "11");
      toggle.setAttribute("fill", "#74b9ff");
      toggle.setAttribute("cursor", "pointer");
      toggle.setAttribute("text-anchor", "middle");
      toggle.setAttribute("dominant-baseline", "central");
      toggle.textContent = collapsed[node.id] ? "▶" : "▼";
      toggle.style.userSelect = "none";
      toggle.addEventListener("click", (e) => {
        e.stopPropagation();
        collapsed[node.id] = !collapsed[node.id];
        render();
      });
      g.appendChild(toggle);
    }
  }
}

let viewState = { tx: 0, ty: 0, scale: 1 };
let isDragging = false, dragStart = { x: 0, y: 0 };
const svg = document.getElementById("canvas");
const mindmap = document.getElementById("mindmap");

function applyTransform() {
  const { tx, ty, scale } = viewState;
  mindmap.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`);
}
applyTransform();

svg.addEventListener("mousedown", (e) => {
  isDragging = true;
  dragStart.x = e.clientX - viewState.tx;
  dragStart.y = e.clientY - viewState.ty;
  svg.style.cursor = "grabbing";
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  viewState.tx = e.clientX - dragStart.x;
  viewState.ty = e.clientY - dragStart.y;
  applyTransform();
});
window.addEventListener("mouseup", () => { isDragging = false; svg.style.cursor = "grab"; });

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  const newScale = Math.min(2, Math.max(0.3, viewState.scale * factor));
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  viewState.tx = mx - (mx - viewState.tx) * (newScale / viewState.scale);
  viewState.ty = my - (my - viewState.ty) * (newScale / viewState.scale);
  viewState.scale = newScale;
  applyTransform();
}, { passive: false });

let lastTouch = null;
svg.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
svg.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1 && lastTouch) {
    e.preventDefault();
    viewState.tx += e.touches[0].clientX - lastTouch.x;
    viewState.ty += e.touches[0].clientY - lastTouch.y;
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    applyTransform();
  }
});
svg.addEventListener("touchend", () => { lastTouch = null; });

window.resetView = function() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  viewState.tx = w * 0.08;
  viewState.ty = h * 0.06;
  viewState.scale = 0.75;
  applyTransform();
};
resetView();

window.toggleCollapse = function() {
  for (const child of data.children) {
    if (child.children) collapsed[child.id] = collapsed[child.id] ? false : true;
  }
  render();
};

window.saveSVG = function() {
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '问答系统v4_思维导图.svg';
  a.click();
  URL.revokeObjectURL(url);
};

render();
resetView();
</script>
</body>
</html>
