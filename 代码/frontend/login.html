<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 多角色聊天机器人</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f6f7fb;
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --line: #e5e7eb;
            --text: #172033;
            --muted: #697386;
            --faint: #98a2b3;
            --blue: #4f8cff;
            --sky-text: #0787b8;
            --mint: #35c4a1;
            --pink: #ff7ca8;
            --danger: #b42318;
            --ok: #159464;
            --shadow: 0 18px 50px rgba(30, 41, 59, 0.08);
            --shadow-sm: 0 8px 22px rgba(30, 41, 59, 0.06);
        }
        html, body { min-height: 100%; }
        body {
            min-height: 100vh;
            display: block;
            padding: 0;
            font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(255,255,255,0.98) 0%, rgba(239,246,255,0.94) 46%, rgba(236,253,245,0.92) 100%),
                radial-gradient(circle at 16% 20%, rgba(79,140,255,0.20), transparent 30%),
                radial-gradient(circle at 84% 74%, rgba(53,196,161,0.18), transparent 32%),
                var(--bg);
        }
        button, input { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.58; }
        .hidden { display: none !important; }
        .shell {
            width: 100%;
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(540px, 1fr);
            overflow: hidden;
            background: transparent;
        }
        .visual {
            min-height: 100vh;
            padding: clamp(36px, 6vw, 82px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-right: 0;
            background: transparent;
            color: var(--sky-text);
            text-align: center;
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .mark {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 900;
            background: linear-gradient(135deg, var(--blue), var(--mint));
        }
        .brand strong { display: block; font-size: 19px; }
        .brand span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
        .visual .brand strong,
        .visual .brand span,
        .visual h1,
        .visual p,
        .mini-row {
            color: var(--sky-text);
        }
        h1 {
            max-width: 760px;
            margin-top: 70px;
            font-size: clamp(52px, 7vw, 96px);
            line-height: 1.05;
            letter-spacing: 0;
            font-family: "STXingkai", "华文行楷", "KaiTi", "楷体", cursive;
            font-weight: 500;
        }
        .visual p {
            max-width: 650px;
            margin-top: 28px;
            color: var(--muted);
            line-height: 1.85;
            font-size: clamp(16px, 1.4vw, 20px);
        }
        .mini-board {
            width: min(760px, 100%);
            margin-top: clamp(42px, 6vh, 82px);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }
        .mini-row {
            display: grid;
            gap: 14px;
            align-content: space-between;
            min-height: 150px;
            padding: 20px;
            border: 1px solid rgba(215, 221, 232, 0.62);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.58);
            box-shadow: 0 16px 40px rgba(30, 41, 59, 0.05);
            color: #344054;
            backdrop-filter: blur(14px);
        }
        .mini-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: var(--blue);
            background: #eaf2ff;
            font-weight: 900;
        }
        .panel {
            min-height: 100vh;
            padding: clamp(42px, 8vw, 112px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, rgba(255,255,255,0.10), rgba(255,255,255,0.56));
            backdrop-filter: blur(10px);
        }
        .tabs {
            width: min(300px, 100%);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 6px;
            margin-bottom: 44px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-2);
        }
        .tab {
            height: 46px;
            border: 0;
            border-radius: 999px;
            color: var(--muted);
            background: transparent;
            font-weight: 800;
        }
        .tab.active {
            color: var(--text);
            background: #ffffff;
            box-shadow: var(--shadow-sm);
        }
        h2 {
            color: var(--sky-text);
            font-family: "STXingkai", "华文行楷", "KaiTi", "楷体", cursive;
            font-size: clamp(38px, 4.5vw, 58px);
            font-weight: 500;
            letter-spacing: 0;
            text-align: center;
        }
        .subtitle { max-width: 520px; margin-top: 14px; margin-bottom: 38px; color: var(--muted); line-height: 1.75; font-size: 17px; text-align: center; }
        form { width: min(540px, 100%); display: grid; gap: 21px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 13px;
            font-weight: 800;
        }
        .input-box { position: relative; }
        .input-symbol {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            font-size: 14px;
            font-weight: 900;
        }
        input {
            width: 100%;
            height: 60px;
            padding: 0 16px 0 46px;
            font-size: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: #fbfcff;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }
        input:focus {
            border-color: rgba(79, 140, 255, 0.68);
            box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.14);
            background: #ffffff;
        }
        .message {
            display: none;
            margin-bottom: 14px;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
        }
        .message.show { display: block; }
        .message.error { color: var(--danger); background: #fff1f0; border: 1px solid #ffd6d1; }
        .message.ok { color: var(--ok); background: #ecfdf3; border: 1px solid #c7f0d9; }
        .primary-btn {
            min-height: 60px;
            font-size: 16px;
            border: 0;
            border-radius: 8px;
            color: #ffffff;
            font-weight: 900;
            background: linear-gradient(135deg, var(--blue), var(--mint));
            box-shadow: 0 12px 24px rgba(79, 140, 255, 0.22);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 28px rgba(79, 140, 255, 0.26); }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover { color: var(--blue); }
        @media (max-width: 800px) {
            body { padding: 0; }
            .shell { min-height: 100vh; grid-template-columns: 1fr; }
            .visual { display: none; }
            .panel { padding: 34px 24px; }
        }
        @media (max-width: 480px) {
            .tabs { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="visual">
            <div class="brand">
                <div class="mark">AI</div>
                <div>
                    <strong>RoleChat</strong>
                    <span>多角色智能对话工作台</span>
                </div>
            </div>
            <div>
                <h1>回到你的角色聊天空间。</h1>
                <p>登录后可继续历史会话、切换专业角色，并维护每个角色自己的资料库。</p>
                <div class="mini-board">
                    <div class="mini-row"><span class="mini-icon">医</span><span>今天的报告该怎么看？</span></div>
                    <div class="mini-row"><span class="mini-icon">法</span><span>这份合同哪里需要注意？</span></div>
                    <div class="mini-row"><span class="mini-icon">英</span><span>帮我把表达说得更自然。</span></div>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="tabs" role="tablist" aria-label="登录注册切换">
                <button class="tab active" id="loginTab" type="button" onclick="setMode('login')">登录</button>
                <button class="tab" id="registerTab" type="button" onclick="setMode('register')">注册</button>
            </div>
            <h2 id="title">欢迎回来</h2>
            <p class="subtitle" id="subtitle">输入账号密码，进入你的角色对话工作台。</p>
            <div class="message" id="message"></div>
            <form onsubmit="submitAuth(event)">
                <div>
                    <label for="username">用户名</label>
                    <div class="input-box"><span class="input-symbol">U</span><input id="username" autocomplete="username" required placeholder="请输入用户名"></div>
                </div>
                <div class="hidden" id="emailField">
                    <label for="email">邮箱</label>
                    <div class="input-box"><span class="input-symbol">@</span><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
                </div>
                <div>
                    <label for="password">密码</label>
                    <div class="input-box"><span class="input-symbol">*</span><input id="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></div>
                </div>
                <button class="primary-btn" id="submitBtn" type="submit">登录</button>
            </form>
            <a class="back-link" href="/">直接打开工作台 →</a>
        </section>
    </main>

    <script>
        const API_BASE_URL = `${window.location.origin}/api`;
        let mode = 'login';

        function setMode(nextMode) {
            mode = nextMode;
            document.getElementById('loginTab').classList.toggle('active', mode === 'login');
            document.getElementById('registerTab').classList.toggle('active', mode === 'register');
            document.getElementById('emailField').classList.toggle('hidden', mode === 'login');
            document.getElementById('email').required = mode === 'register';
            document.getElementById('title').textContent = mode === 'login' ? '欢迎回来' : '创建账号';
            document.getElementById('subtitle').textContent = mode === 'login' ? '输入账号密码，进入你的角色对话工作台。' : '注册后即可保存你的角色、资料库和历史会话。';
            document.getElementById('submitBtn').textContent = mode === 'login' ? '登录' : '注册并登录';
            showMessage('', '');
        }

        function showMessage(type, text) {
            const el = document.getElementById('message');
            el.className = 'message';
            el.textContent = text || '';
            if (type && text) el.classList.add('show', type);
        }

        async function request(path, body) {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
            if (!response.ok) {
                const detail = data.detail || '请求失败';
                throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
            }
            return data;
        }

        async function submitAuth(event) {
            event.preventDefault();
            const submit = document.getElementById('submitBtn');
            submit.disabled = true;
            showMessage('', '');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();

            try {
                if (mode === 'register') {
                    await request('/user/register', { username, password, email });
                    showMessage('ok', '注册成功，正在登录...');
                }
                const result = await request('/user/login', { username, password });
                localStorage.setItem('chatbot_user', JSON.stringify({
                    id: result.user_id,
                    username: result.username,
                    token: result.access_token
                }));
                window.location.href = '/';
            } catch (error) {
                showMessage('error', error.message || '操作失败');
            } finally {
                submit.disabled = false;
            }
        }

        if (localStorage.getItem('chatbot_user')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
