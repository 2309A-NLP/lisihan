# 基金问答智能体 (博金杯)

## 系统架构
### ReAct Agent 模式
- 用户问题 → SiliconFlow LLM(DeepSeek-V3) → 生成SQL → SQLite查询 → 结果回答
- temperature=0.01 | 最大8步推理
- 双策略降级: ReAct Agent → 备用正则解析器 → 错误提示
### Flask Web 服务
- 端口 5002
- answer_question() 双策略路由
- parse_question 正则解析器
- query_stock_count / query_stock_list
### 批量测试
- 603 题全覆盖
- 两段式: 生成SQL → 执行 → 回答
- 每50题自动保存 + 断点续跑
- >500行结果自动重试

## 核心代码文件
### react_agent.py (398行)
- System Prompt + DB Schema
- call_llm() LLM调用
- query_db() SQLite执行
- extract_block() SQL提取
### app.py (381行)
- Flask 路由 + Web 入口
- answer_question 主逻辑
- parse_question 正则降级
- 双策略容错
### batch_test.py (289行)
- 批量处理引擎
- 中间保存/断点续跑
- 自动重试机制
### make_submit.py (30行)
- 提取提交格式
### templates/index.html
- 暗色GitHub风格UI
- 提示词展示 + 历史记录

<script>
(function() {
  // Wait for markmap autoloader to be ready
  function initMarkmap() {
    if (typeof window.markmap === 'undefined' || !window.markmap.autoLoader) {
      setTimeout(initMarkmap, 200);
      return;
    }
    
    const markdown = document.getElementById('mindmap-data').textContent;
    const svg = document.getElementById('markmap-svg');
    
    // Parse H1/# as root, H2/## as children, etc.
    const lines = markdown.split('\n');
    let rootContent = '';
    let depth = 0;
    const tree = { name: '', children: [] };
    const stack = [tree];
    
    for (const line of lines) {
      if (line.startsWith('# ')) {
        // root node
        const name = line.replace(/^# /, '').trim();
        tree.name = name;
      } else if (line.startsWith('## ')) {
        const name = line.replace(/^## /, '').trim();
        const node = { name, children: [] };
        tree.children.push(node);
        stack[1] = node;
        depth = 1;
      } else if (line.startsWith('### ')) {
        const name = line.replace(/^### /, '').trim();
        const node = { name, children: [] };
        stack[1].children.push(node);
        stack[2] = node;
        depth = 2;
      } else if (line.startsWith('#### ')) {
        const name = line.replace(/^#### /, '').trim();
        const node = { name, children: [] };
        const parent = stack[2] || stack[1];
        parent.children.push(node);
        stack[3] = node;
        depth = 3;
      } else if (line.match(/^- /)) {
        const name = line.replace(/^- /, '').trim();
        const node = { name };
        // Find appropriate parent
        let parent = stack[depth] || stack[depth-1] || tree;
        if (!parent.children) parent.children = [];
        parent.children.push(node);
      } else if (line.match(/^  - /)) {
        const name = line.replace(/^  - /, '').trim();
        const node = { name };
        const parent = stack[depth] || tree;
        if (!parent.children) parent.children = [];
        parent.children.push(node);
      } else if (line.match(/^    - /)) {
        const name = line.replace(/^    - /, '').trim();
        const node = { name };
        // Find last child of current parent
        const parent = stack[depth] || tree;
        if (parent.children && parent.children.length > 0) {
          const lastChild = parent.children[parent.children.length - 1];
          if (!lastChild.children) lastChild.children = [];
          lastChild.children.push(node);
        } else {
          if (!parent.children) parent.children = [];
          parent.children.push(node);
        }
      }
    }
    
    // Render with markmap
    try {
      window.markmap.Markmap.create(svg, {
        zoom: true,
        pan: true,
        fitRatio: 0.95,
        duration: 500,
        nodeMinHeight: 24,
        maxWidth: 280,
        spacingVertical: 10,
        spacingHorizontal: 60,
        paddingX: 14,
        paddingY: 10,
      }, tree);
    } catch(e) {
      // Fallback: let autoloader handle it
      document.getElementById('mindmap-data').setAttribute('type', 'text/markdown');
      document.getElementById('mindmap-data').removeAttribute('type');
      document.getElementById('mindmap-data').textContent = markdown;
    }
  }
  
  initMarkmap();
})();
</script>
